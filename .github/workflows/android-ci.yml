name: android-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build, lint y tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Permisos de ejecución para gradlew
        run: chmod +x gradlew

      # Los runners de GitHub normalmente traen las plataformas recientes;
      # este paso es idempotente y cubre el caso de que falte la 37.
      - name: Asegurar plataforma del SDK (compileSdk 37)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" > /dev/null 2>&1 || true

      - name: ktlint + lint + tests
        run: ./gradlew ktlintCheck lint test --stacktrace

      - name: Assemble debug APK (solo main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: ./gradlew assembleDebug --stacktrace

      - name: Subir APK como artefacto (solo main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
